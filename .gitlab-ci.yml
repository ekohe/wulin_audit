image: ruby:4.0.9

stages:
  - test

default:
  before_script:
    - bundle config set --local path vendor/bundle
    - bundle install --jobs 8
  cache:
    key:
      files:
        - Gemfile.lock
    paths:
      - vendor/bundle

build:
  stage: test
  script:
    - gem build wulin_audit.gemspec

test:
  stage: test
  script:
    - bundle exec rake test

lint:
  stage: test
  script:
    - bundle exec standardrb
